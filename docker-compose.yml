version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paga-justo-postgres
    environment:
      POSTGRES_DB: paga_justo
      POSTGRES_USER: paga_justo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paga_justo_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paga_justo -d paga_justo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paga-justo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data: